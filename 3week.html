<!DOCTYPE html>

## 14장 font size
<!DOCTYPE html>
<html lang="en">
<head>

## 15장
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0>
    <title>CSS(Cascading Style Sheets) - Week 3</title>
    <style>
        h1{font-size: 40px;}
        p{font-size: 20px;}
        h1{font-family:'Arial', sans-serif;}
        ## font-weight ; 폰트 굵기를 의미.
        ## line-weight ; 크기 단위 or 배수를 의미. 
    
    </style>
</head>
<body>
    <h1> This is 3 week study. </h1>
    <p> This is 3 week study. </p>
</body>

</html>
